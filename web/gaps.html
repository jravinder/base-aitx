<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gap ledger | Base Fleet</title>
<link rel="stylesheet" href="assets/stitch/fonts.css">
<script src="assets/stitch/tailwind.js"></script>
<script id="tailwind-config">if (window.tailwind) tailwind.config = { darkMode: "class", corePlugins: { preflight: false }, theme: { extend: { "colors": { "surface-container-highest": "#d8e3fb", "inverse-primary": "#a0d3a6", "secondary-container": "#cbf080", "outline": "#717970", "secondary": "#4a6700", "secondary-fixed-dim": "#afd367", "primary-fixed": "#bbefc1", "on-primary-fixed": "#00210b", "primary-container": "#1e4d2b", "on-tertiary": "#ffffff", "ink-primary": "#0F172A", "primary": "#023616", "on-tertiary-container": "#63c479", "inverse-on-surface": "#ecf1ff", "surface-container-high": "#dee8ff", "evergreen-deep": "#004A31", "on-tertiary-fixed-variant": "#005323", "on-secondary-fixed-variant": "#374e00", "surface-bright": "#f9f9ff", "surface-container": "#e7eeff", "error-container": "#ffdad6", "surface-muted": "#F8FAFC", "background": "#f9f9ff", "tertiary-container": "#004f21", "on-tertiary-fixed": "#00210a", "on-secondary-container": "#506e08", "tertiary": "#003614", "on-surface": "#111c2d", "surface-container-lowest": "#ffffff", "on-primary-fixed-variant": "#21502e", "critical-red": "#EF4444", "tertiary-fixed": "#95f8a7", "tertiary-fixed-dim": "#79db8d", "on-primary-container": "#8bbd92", "on-secondary-fixed": "#141f00", "solar-green": "#22C55E", "wire-border": "#E2E8F0", "on-background": "#111c2d", "on-error-container": "#93000a", "energy-lime": "#84CC16", "surface-subtle": "#F1F5F9", "surface-tint": "#396844", "on-surface-variant": "#414941", "warning-amber": "#F59E0B", "outline-variant": "#c1c9be", "error": "#ba1a1a", "surface": "#f9f9ff", "on-secondary": "#ffffff", "on-error": "#ffffff", "surface-dim": "#cfdaf2", "surface-container-low": "#f0f3ff", "inverse-surface": "#263143", "secondary-fixed": "#cbf080", "surface-variant": "#d8e3fb", "on-primary": "#ffffff", "primary-fixed-dim": "#a0d3a6" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-sm": "0.5rem", "space-xs": "0.25rem", "gutter": "1.5rem", "margin": "2rem", "gutter-lg": "2rem", "space-md": "1rem", "space-lg": "1.5rem", "space-xl": "2rem", "margin-xl": "3rem" }, "fontFamily": { "telemetry-metric": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "label-caps": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "telemetry-unit": ["Plus Jakarta Sans"], "display-sm": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"] }, "fontSize": { "telemetry-metric": ["36px", { "lineHeight": "40px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "22px", "letterSpacing": "0em", "fontWeight": "400" }], "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.06em", "fontWeight": "700" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.015em", "fontWeight": "600" }], "telemetry-unit": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "600" }], "display-sm": ["32px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-lg": ["16px", { "lineHeight": "26px", "letterSpacing": "0em", "fontWeight": "400" }], "label-md": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "600" }], "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "-0.005em", "fontWeight": "600" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "400" }] } } } };</script>
<link rel="stylesheet" href="shell.css">
<style>.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
#main{overflow-wrap:anywhere}
body{margin:0}
#main p,#main h1,#main h2,#main h3,#main h4,#main dl,#main dd,#main ol{margin:0}
#main a,.shell nav[aria-label=Breadcrumb] a{text-decoration:none}
.gap-card:target{outline:2px solid #1e4d2b;outline-offset:2px}
.gap-card{scroll-margin-top:20px}
.filter-btn[aria-pressed=true]{background:#1e4d2b;border-color:#1e4d2b;color:#fff}
.filter-btn[aria-pressed=true] .n{background:#004A31;color:#cbf080}</style>
<script defer src="shell.js"></script>
</head>
<body class="bg-surface-muted text-ink-primary font-body-md text-body-md antialiased">
<main id="main" class="flex-1 max-w-[1440px] w-full mx-auto px-4 sm:px-6 py-8">
 <section class="grid grid-cols-12 gap-6 mb-8 items-start">
  <div class="col-span-12 lg:col-span-7 space-y-4 min-w-0">
   <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-lg bg-surface-subtle border border-wire-border">
    <span class="w-1.5 h-1.5 rounded-full bg-solar-green"></span>
    <span class="font-label-caps text-label-caps text-evergreen-deep tracking-wider uppercase">Operate, gap ledger</span>
   </div>
   <h1 class="font-display-sm text-display-sm text-ink-primary tracking-tight">Claim verification</h1>
   <p class="font-body-lg text-body-lg text-outline max-w-2xl">Each issue records a claim we checked, the evidence we found and the correction we made. Open gaps are marked, so you can see which results are still under review. Status reflects the snapshot date below.</p>
   <div class="pt-2 flex flex-wrap items-center gap-2" role="group" aria-label="Show gaps">
    <button type="button" class="filter-btn px-4 py-2 rounded-lg font-label-md text-label-md border border-wire-border bg-surface-container-lowest text-ink-primary flex items-center gap-2 cursor-pointer" data-filter="all" aria-pressed="true"><span>All</span><span class="n px-1.5 py-0.5 rounded text-xs bg-surface-subtle text-outline" id="n-all"></span></button>
    <button type="button" class="filter-btn px-4 py-2 rounded-lg font-label-md text-label-md border border-wire-border bg-surface-container-lowest text-ink-primary flex items-center gap-2 cursor-pointer" data-filter="open" aria-pressed="false"><span class="w-2 h-2 rounded-full bg-warning-amber"></span><span>Open</span><span class="n px-1.5 py-0.5 rounded text-xs bg-surface-subtle text-outline" id="n-open"></span></button>
    <button type="button" class="filter-btn px-4 py-2 rounded-lg font-label-md text-label-md border border-wire-border bg-surface-container-lowest text-ink-primary flex items-center gap-2 cursor-pointer" data-filter="closed" aria-pressed="false"><span class="w-2 h-2 rounded-full bg-solar-green"></span><span>Fixed</span><span class="n px-1.5 py-0.5 rounded text-xs bg-surface-subtle text-outline" id="n-closed"></span></button>
   </div>
  </div>
  <div class="col-span-12 lg:col-span-5 bg-surface-container-lowest border border-wire-border rounded-xl p-6 shadow-sm min-w-0">
   <div class="flex items-center justify-between gap-2 pb-3 border-b border-wire-border">
    <span class="font-label-caps text-label-caps text-outline uppercase tracking-wider">Gap resolution</span>
    <span class="text-xs font-semibold text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">Ledger</span>
   </div>
   <div id="counts" class="mt-4"></div>
  </div>
 </section>

 <div class="flex flex-wrap items-center justify-between gap-2 pb-3 mb-4 border-b border-wire-border">
  <h2 class="font-headline-sm text-headline-sm text-ink-primary">Gap log</h2>
  <span class="text-xs text-outline bg-surface-subtle px-2 py-0.5 rounded">Newest first</span>
 </div>
 <ol class="gaps list-none p-0 space-y-4" id="list"></ol>
 <footer class="font-body-sm text-body-sm text-outline py-8 mt-8 border-t border-wire-border"><p id="src"></p></footer>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch("data/gaps.json").then(r => r.json()).then(d => {
  const gaps = d.issues.filter(i => !i.hunt);
  const found = gaps.length, fixed = gaps.filter(i => i.state === "closed").length;
  const open = gaps.filter(i => i.state === "open");
  const pct = found ? Math.round(100 * fixed / found) : 0;
  document.getElementById("counts").innerHTML =
    `<div class="flex items-baseline justify-between gap-4 flex-wrap">` +
      `<div><div class="font-telemetry-metric text-telemetry-metric text-ink-primary tracking-tight"><span class="count"><b>${found}</b> <span>gaps found</span></span>, <span class="count"><b>${fixed}</b> <span>gaps fixed</span></span></div>` +
      `<div class="font-body-sm text-body-sm text-outline mt-1">Claims checked against public data and field evidence</div></div>` +
      `<div class="text-right"><span class="font-headline-lg text-headline-lg text-primary-container font-bold">${pct}%</span><div class="text-[11px] font-label-caps text-outline uppercase">Fixed</div></div></div>` +
    `<div class="mt-5 w-full h-3 bg-surface-subtle rounded-full overflow-hidden flex border border-wire-border p-0.5"><div class="h-full bg-primary-container rounded-l-full" style="width:${pct}%"></div><div class="h-full bg-warning-amber rounded-r-full" style="width:${100 - pct}%"></div></div>` +
    `<div class="mt-2 flex flex-wrap justify-between gap-2 text-xs font-medium">` +
      `<span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded bg-primary-container inline-block"></span>${fixed} fixed</span>` +
      `<span class="count flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded bg-warning-amber inline-block"></span><b>${open.length}</b> <span>open: ${open.map(i => `<a class="text-primary-container font-semibold underline underline-offset-2" href="#${i.number}">#${i.number}</a>`).join(", ")}</span></span></div>`;
  document.getElementById("n-all").textContent = d.issues.length;
  document.getElementById("n-open").textContent = d.issues.filter(i => i.state === "open").length;
  document.getElementById("n-closed").textContent = d.issues.filter(i => i.state === "closed").length;
  document.getElementById("list").innerHTML = d.issues.map(i => {
    const pill = i.hunt ? `<span class="pill hunt inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-blue-50 text-blue-800 border border-blue-200 whitespace-nowrap">umbrella, ${esc(i.state)}</span>`
      : i.state === "open" ? `<span class="pill open inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-800 border border-amber-200 whitespace-nowrap"><span class="w-1.5 h-1.5 rounded-full bg-warning-amber"></span>open</span>`
      : `<span class="pill closed inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200 whitespace-nowrap"><span class="w-1.5 h-1.5 rounded-full bg-solar-green"></span>fixed${i.closed ? " " + esc(i.closed) : ""}</span>`;
    const body = (i.body || "").trim();
    return `<li id="${i.number}" data-state="${esc(i.state)}" class="gap-card bg-surface-container-lowest border border-wire-border rounded-xl overflow-hidden shadow-sm">` +
      `<div class="head px-5 sm:px-6 py-4 bg-surface-muted border-b border-wire-border flex flex-wrap items-center justify-between gap-3">` +
      `<div class="flex items-center gap-3 min-w-0 flex-1"><a class="num font-bold text-xs px-2.5 py-1 rounded bg-surface-container text-ink-primary border border-wire-border shrink-0" href="#${i.number}">#${i.number}</a>` +
      `<p class="title font-headline-sm text-headline-sm text-ink-primary min-w-0">${esc(i.title)}</p></div>${pill}</div>` +
      (body ? `<p class="body px-5 sm:px-6 py-4 font-body-md text-body-md text-on-surface-variant whitespace-pre-wrap">${esc(body)}${body.length >= 600 ? " ..." : ""}</p>` : "") + `</li>`;
  }).join("");
  document.getElementById("src").textContent = `Source: ${d.source}. Built ${d.built_at}. Each card shows the first 600 characters of the issue.`;
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
});
document.querySelectorAll(".filter-btn").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".filter-btn").forEach(x => x.setAttribute("aria-pressed", x === b));
  const f = b.dataset.filter;
  document.querySelectorAll("#list > li").forEach(li => { li.hidden = f !== "all" && li.dataset.state !== f; });
}));
</script>
</body>
</html>
